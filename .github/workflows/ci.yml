name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  review-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Check external OCI provider
        env:
          OSCM_PLUGIN_ROOT: ${{ github.workspace }}/integrations/review-mode.nvim
        run: nvim --headless -u NONE -i NONE -c "luafile integrations/review-mode.nvim/scripts/check.lua"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/oci-scm
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Workflow lint
        uses: docker://rhysd/actionlint:1.7.11
      - uses: goreleaser/goreleaser-action@v7.2.1
        with:
          version: '~> v2'
          args: check
