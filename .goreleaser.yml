version: 2
project_name: oci-scm
before:
  hooks:
    - go mod download
    - go test ./...
builds:
  - id: oscm
    main: ./cmd/oci-scm
    binary: oscm
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/adrianmross/oci-scm/internal/cli.version={{.Version}}
  - id: oci-scm
    main: ./cmd/oci-scm
    binary: oci-scm
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/adrianmross/oci-scm/internal/cli.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md, docs/*]
checksum:
  name_template: checksums.txt
release:
  prerelease: auto
